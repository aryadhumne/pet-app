{% extends "base.html" %}
{% block content %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

* { box-sizing: border-box; }

body { font-family: 'Nunito', sans-serif; background: #F0F9FF; }

.page-wrapper {
    display: flex;
    justify-content: center;
    padding: 20px 16px 100px;
}

.health-card {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 28px 24px;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(16,185,129,0.12);
    border: 1.5px solid #D1FAE5;
    margin-top: 16px;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #6366F1;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    margin: 16px 16px 0;
    font-family: 'Sora', sans-serif;
}
.back-btn:hover { opacity: 0.75; }

.title {
    font-family: 'Sora', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: #064E3B;
    margin-bottom: 22px;
    text-align: center;
    padding-bottom: 16px;
    border-bottom: 2px solid #D1FAE5;
}

.form-label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    color: #10B981;
    margin-bottom: 5px;
    letter-spacing: 0.3px;
}

.input-box {
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1.5px solid #D1FAE5;
    background: #F0FDF4;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #064E3B;
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.2s, background 0.2s;
    display: block;
}
.input-box:focus {
    border-color: #10B981;
    background: white;
    box-shadow: 0 0 0 4px rgba(16,185,129,0.1);
}
.input-box::placeholder { color: #9CA3AF; font-weight: 500; }

.save-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #10B981, #059669);
    color: white;
    border: none;
    border-radius: 16px;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(16,185,129,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 4px;
}
.save-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(16,185,129,0.45);
}
.save-btn:active { transform: translateY(0); }

.status-msg { margin-top: 14px; font-size: 13px; font-weight: 700; text-align: center; padding: 10px; border-radius: 12px; display: none; }
.status-msg.success { background: #DCFCE7; color: #166534; display: block; }
.status-msg.error   { background: #FEE2E2; color: #991B1B; display: block; }
</style>

<a href="/pet/{{ pet_id }}" class="back-btn">← Back to Profile</a>

<div class="page-wrapper">
    <div class="health-card">
        <h2 class="title">🩺 Health Checkup</h2>

        <!-- pet_id is passed as hidden field so it saves to the right pet -->
        <form id="healthCheckupForm">
            <input type="hidden" name="pet_id" value="{{ pet_id }}">

            <label class="form-label">Date 📅</label>
            <input type="date" name="date" class="input-box" required>

            <label class="form-label">Weight (kg) ⚖️</label>
            <input type="number" step="0.1" name="weight" class="input-box" placeholder="e.g. 12.5" required>

            <label class="form-label">Temperature (°F) 🌡️</label>
            <input type="number" step="0.1" name="temperature" class="input-box" placeholder="e.g. 101.5" required>

            <label class="form-label">Notes 📝</label>
            <input type="text" name="notes" class="input-box" placeholder="Any observations...">

            <label class="form-label">Next Checkup Date 📅</label>
            <input type="date" name="next_checkup" class="input-box">

            <button type="submit" class="save-btn">Save Checkup 💾</button>
        </form>

        <div id="statusMessage" class="status-msg"></div>
    </div>
</div>

<script>
document.getElementById("healthCheckupForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const form    = e.target;
    const formData = new FormData(form);
    const btn     = form.querySelector(".save-btn");
    const msg     = document.getElementById("statusMessage");

    btn.disabled    = true;
    btn.textContent = "Saving...";

    fetch("/health_checkup", {
        method: "POST",
        body: formData
    })
    .then(resp => {
        // If the server redirects (302), it means save was successful
        if (resp.redirected) {
            window.location.href = resp.url;
            return;
        }
        return resp.json();
    })
    .then(data => {
        if (!data) return; // already redirected
        if (data.success) {
            msg.className     = "status-msg success";
            msg.textContent   = "✅ Checkup saved! Redirecting...";
            setTimeout(() => { window.location.href = "/pet/" + formData.get("pet_id"); }, 1200);
        } else {
            msg.className   = "status-msg error";
            msg.textContent = "❌ " + (data.error || "Could not save. Try again.");
            btn.disabled    = false;
            btn.textContent = "Save Checkup 💾";
        }
    })
    .catch(() => {
        // redirect happened at network level
        window.location.href = "/pet/" + formData.get("pet_id");
    });
});
</script>

{% endblock %}
