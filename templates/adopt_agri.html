{% extends "base.html" %}
{% block content %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    background: #F0FDF4;
}

/* ── HEADER ── */
.header {
    background: linear-gradient(135deg, #16A34A 0%, #059669 50%, #0D9488 100%);
    padding: 32px 20px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.header::before {
    content: '';
    position: absolute;
    width: 220px; height: 220px;
    background: rgba(255,255,255,0.07);
    border-radius: 50%;
    top: -70px; right: -60px;
}
.header::after {
    content: '';
    position: absolute;
    bottom: -18px; left: 0; right: 0;
    height: 36px;
    background: #F0FDF4;
    border-radius: 36px 36px 0 0;
}
.header h1 {
    font-family: 'Sora', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: white;
    margin: 0 0 6px;
    background: none;
    -webkit-text-fill-color: white;
    text-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.header p {
    font-size: 13px;
    color: rgba(255,255,255,0.82);
    font-weight: 600;
    margin: 0;
}

/* ── SYNC BAR ── */
.sync-bar {
    display: block;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 18px;
    background: #DCFCE7;
    color: #15803D;
    border-radius: 20px;
    max-width: 200px;
    margin: 18px auto 0;
    font-family: 'Nunito', sans-serif;
}
.sync-bar.error { background: #FEE2E2; color: #991B1B; }

/* ── SEARCH ── */
.search-box {
    padding: 16px 16px 0;
    text-align: left;
}
.search-box input {
    width: 100%;
    padding: 13px 18px;
    border-radius: 16px;
    border: 1.5px solid #BBF7D0;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #064E3B;
    outline: none;
    box-shadow: 0 4px 14px rgba(16,163,74,0.09);
    transition: border-color 0.2s;
}
.search-box input:focus { border-color: #16A34A; }
.search-box input::placeholder { color: #9CA3AF; font-weight: 500; }

/* ── TABS ── */
.tabs {
    display: flex;
    gap: 10px;
    padding: 14px 16px 0;
    text-align: left;
    margin: 0;
}
.tab-btn {
    flex: 1;
    padding: 11px 8px;
    border: 2px solid #BBF7D0;
    background: white;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 800;
    font-size: 13px;
    color: #16A34A;
    font-family: 'Nunito', sans-serif;
    transition: all 0.2s;
    margin: 0;
}
.tab-btn.active {
    background: #16A34A;
    color: white;
    border-color: #16A34A;
    box-shadow: 0 6px 18px rgba(16,163,74,0.3);
}
.tab-btn:hover:not(.active) { background: #F0FDF4; }

/* ── PET GRID ── */
.pets {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 14px;
    padding: 16px;
}

/* ── PET CARD ── */
.pet-card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(16,163,74,0.1);
    overflow: hidden;
    position: relative;
    transition: transform 0.22s, box-shadow 0.22s;
}
.pet-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 32px rgba(16,163,74,0.18);
}
.pet-card img {
    width: 100%;
    height: 148px;
    object-fit: cover;
    display: block;
}
.pet-body { padding: 12px; }
.pet-body h3 {
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: #064E3B;
    margin: 0 0 3px;
}
.pet-body p {
    font-size: 12px;
    color: #6B7280;
    font-weight: 600;
    margin: 0 0 10px;
}

/* price replaces old .price */
.price {
    display: inline-block;
    background: #DCFCE7;
    color: #15803D;
    font-size: 13px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
    font-family: 'Sora', sans-serif;
}

/* buy-btn */
.buy-btn {
    width: 100%;
    padding: 10px;
    border: none;
    background: linear-gradient(135deg, #16A34A, #059669);
    color: white;
    border-radius: 12px;
    margin-top: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    font-family: 'Nunito', sans-serif;
    transition: opacity 0.2s, transform 0.2s;
}
.buy-btn:hover { opacity: 0.88; transform: translateY(-1px); }

/* remove-btn */
.remove-btn {
    width: 100%;
    padding: 9px;
    border: none;
    background: #FEE2E2;
    color: #DC2626;
    border-radius: 12px;
    margin-top: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 800;
    font-family: 'Nunito', sans-serif;
    transition: background 0.2s;
}
.remove-btn:hover { background: #FECACA; }

/* seller badge */
.seller-badge {
    position: absolute;
    top: 9px;
    right: 9px;
    background: rgba(16,163,74,0.92);
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 20px;
    font-family: 'Nunito', sans-serif;
}

/* empty state */
.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #9CA3AF;
    font-size: 14px;
    font-weight: 700;
    grid-column: 1 / -1;
    font-family: 'Nunito', sans-serif;
}

/* ── SELL BOX ── */
.sell-box {
    background: white;
    padding: 24px 20px;
    width: calc(100% - 32px);
    max-width: 460px;
    margin: 16px auto;
    border-radius: 22px;
    box-shadow: 0 6px 24px rgba(16,163,74,0.1);
}
.sell-box h3 {
    font-family: 'Sora', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: #064E3B;
    margin: 0 0 18px;
    padding-bottom: 14px;
    border-bottom: 2px solid #DCFCE7;
}
.sell-box input,
.sell-box select {
    width: 100%;
    margin: 0 0 10px 0;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1.5px solid #D1FAE5;
    background: #F9FFF9;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #064E3B;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s;
}
.sell-box input:focus,
.sell-box select:focus { border-color: #16A34A; background: white; }
.sell-box input::placeholder { color: #9CA3AF; font-weight: 500; }
.sell-box button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #16A34A, #059669);
    color: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 800;
    box-shadow: 0 8px 24px rgba(16,163,74,0.32);
    margin-top: 6px;
    transition: transform 0.2s, box-shadow 0.2s;
}
.sell-box button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(16,163,74,0.42);
}

/* big preview */
.big-preview {
    height: 160px;
    border: 2.5px dashed #BBF7D0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    overflow: hidden;
    background: #F0FDF4;
    color: #9CA3AF;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
}
.big-preview img { width: 100%; height: 100%; object-fit: cover; }

/* ── LOADING ── */
.loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.75);
    z-index: 9999;
    align-items: center;
    justify-content: center;
}
.loading-overlay.show { display: flex; }
.spinner {
    width: 42px; height: 42px;
    border: 5px solid #BBF7D0;
    border-top-color: #16A34A;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>


<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<div class="header">
    <h1>🐄 Agri Animal Marketplace</h1>
    <p>Buy, Sell and Adopt Farm Animals</p>
</div>

<div class="sync-bar" id="syncBar">Connecting...</div>

<div class="search-box">
    <input id="searchInput" placeholder="🔍  Search animals..." oninput="renderPets()">
</div>

<div class="tabs">
    <button class="tab-btn" onclick="openTab(event,'sell')">➕ Sell</button>
    <button class="tab-btn active" onclick="openTab(event,'buy')">🛒 Buy</button>
    <button class="tab-btn" onclick="openTab(event,'adopt')">❤️ Adopt</button>
</div>

<!-- BUY -->
<div id="buy" class="section">
    <div class="pets" id="buyList"></div>
</div>

<!-- ADOPT -->
<div id="adopt" class="section" style="display:none;">
    <div class="pets" id="adoptList"></div>
</div>

<!-- SELL -->
<div id="sell" class="section" style="display:none;">
    <div class="sell-box">
        <h3>🌾 Sell or Give for Adoption</h3>
        <div class="big-preview" id="mainPreview">📷 Upload Image</div>
        <input type="file" accept="image/*" onchange="previewMain(event)">
        <input id="petName" placeholder="Animal Name *">
        <select id="petType">
            <option>Cow</option>
            <option>Buffalo</option>
            <option>Goat</option>
            <option>Sheep</option>
            <option>Chicken</option>
            <option>Camel</option>
            <option>Horse</option>
            <option>Ox</option>
            <option>Rooster</option>
            <option>Pig</option>
            <option>Donkey</option>
        </select>
        <input id="petBreed" placeholder="Breed">
        <input id="petAge" placeholder="Age">
        <input id="petPrice" type="number" placeholder="Price (leave empty for free adoption)">
        <input id="ownerPhone" placeholder="📞 Phone">
        <button onclick="addPet()">Submit Listing 🌾</button>
    </div>
</div>


<script>
const CURRENT_USER = "{{ username }}";
const POLL_INTERVAL = 8000;
let pets = [];
let mainImage = "";

function setSyncBar(msg, cls) {
    const bar = document.getElementById("syncBar");
    bar.textContent = msg;
    bar.className = "sync-bar " + (cls || "");
}

function showLoading() { document.getElementById("loadingOverlay").classList.add("show"); }
function hideLoading() { document.getElementById("loadingOverlay").classList.remove("show"); }

async function loadPets() {
    try {
        const res = await fetch('/api/agripets');
        return await res.json();
    } catch(e) {
        setSyncBar("Could not load animals", "error");
        return [];
    }
}

async function init() {
    showLoading();
    pets = await loadPets();
    hideLoading();
    setSyncBar("Live from server");
    renderPets();

    setInterval(async function() {
        const fresh = await loadPets();
        if (JSON.stringify(fresh) !== JSON.stringify(pets)) {
            pets = fresh;
            renderPets();
            setSyncBar("Updated");
        }
    }, POLL_INTERVAL);
}

async function addPet() {
    const name = document.getElementById("petName").value.trim();
    if (!name) { alert("Enter Animal Name"); return; }

    showLoading();
    try {
        const res = await fetch('/api/agripets/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name:  name,
                type:  document.getElementById("petType").value,
                breed: document.getElementById("petBreed").value,
                age:   document.getElementById("petAge").value,
                price: document.getElementById("petPrice").value || 0,
                phone: document.getElementById("ownerPhone").value,
                image: mainImage || "https://via.placeholder.com/300"
            })
        });
        const result = await res.json();
        if (result.success) {
            pets = await loadPets();
            renderPets();
            alert("Animal added! Visible to all users.");
            document.getElementById("petName").value = "";
            document.getElementById("petBreed").value = "";
            document.getElementById("petAge").value = "";
            document.getElementById("petPrice").value = "";
            document.getElementById("ownerPhone").value = "";
            document.getElementById("petType").selectedIndex = 0;
            mainImage = "";
            document.getElementById("mainPreview").innerHTML = "📷 Upload Image";
        } else {
            alert("Error: " + (result.error || "Could not add."));
        }
    } catch(e) {
        alert("Server error. Please try again.");
    }
    hideLoading();
}

async function removePet(id) {
    const pet = pets.find(function(p) { return p.id == id; });
    if (!pet) return;
    if (!confirm("Remove " + pet.name + " from the marketplace?")) return;
    showLoading();
    try {
        const res = await fetch('/api/agripets/remove/' + id, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
            pets = await loadPets();
            renderPets();
        } else {
            alert("Error: " + (result.error || "Could not remove."));
        }
    } catch(e) {
        alert("Server error. Please try again.");
    }
    hideLoading();
}

function renderPets() {
    const buyList   = document.getElementById("buyList");
    const adoptList = document.getElementById("adoptList");
    buyList.innerHTML   = "";
    adoptList.innerHTML = "";

    const q = document.getElementById("searchInput").value.toLowerCase();
    const filtered = pets.filter(function(p) {
        return p.name.toLowerCase().includes(q) || p.type.toLowerCase().includes(q);
    });

    if (filtered.length === 0) {
        const msg = '<div class="empty-state">No animals listed yet. Be the first to add one!</div>';
        buyList.innerHTML   = msg;
        adoptList.innerHTML = msg;
        return;
    }

    filtered.forEach(function(p) {
        const isMine    = p.added_by === CURRENT_USER;
        const badge     = isMine ? '<span class="seller-badge">Your Listing</span>' : '';
        const removeBtn = isMine
            ? '<button class="remove-btn" onclick="removePet(' + p.id + ')">Remove My Listing</button>'
            : '';
        const priceLabel = p.price > 0 ? 'Rs.' + p.price : 'Free Adoption';

        const cardHtml = '<div class="pet-card">'
            + badge
            + '<img src="' + p.image + '" onerror="this.src=\'https://via.placeholder.com/300\'">'
            + '<div class="pet-body">'
            + '<h3>' + p.name + '</h3>'
            + '<p>' + p.type + (p.breed ? ' - ' + p.breed : '') + '</p>'
            + '<div class="price">' + priceLabel + '</div>'
            + '<button class="buy-btn" onclick="alert(\'Contact: ' + p.phone + '\')">Contact Owner</button>'
            + removeBtn
            + '</div></div>';

        if (p.price > 0) {
            buyList.innerHTML += cardHtml;
        } else {
            adoptList.innerHTML += cardHtml;
        }
    });
}

function openTab(event, tab) {
    document.querySelectorAll('.section').forEach(function(s) { s.style.display = 'none'; });
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById(tab).style.display = 'block';
    event.target.classList.add('active');
}

function previewMain(e) {
    const r = new FileReader();
    r.onload = function() {
        mainImage = r.result;
        document.getElementById("mainPreview").innerHTML = '<img src="' + mainImage + '">';
    };
    r.readAsDataURL(e.target.files[0]);
}

init();
</script>

{% endblock %}
