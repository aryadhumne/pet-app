<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Poppins",sans-serif;
    }

    html,body{
      height:100%;
    }

    /* PAGE BACKGROUND */
    .page{
      min-height:100vh;
      background:url("{{ url_for('static', filename='images/welcome2.jpeg') }}")
      no-repeat center center/cover;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      padding:20px;
    }

    /* LAVENDER BLUR OVERLAY */
    .page::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(245,243,255,0.75);
      backdrop-filter:blur(8px);
    }

    /* CARD */
    .forgot-card{
      position:relative;
      background:rgba(255,255,255,0.92);
      padding:36px 26px;
      border-radius:26px;
      width:100%;
      max-width:360px;
      box-shadow:0 14px 30px rgba(0,0,0,0.18);
      text-align:center;
    }

    h2{
      margin-bottom:16px;
      color:#6d28d9;
    }

    /* FLASH MESSAGES */
    .alert{
      padding:10px;
      border-radius:8px;
      margin-bottom:12px;
      font-size:14px;
    }

    .alert.success{
      background:#d1fae5;
      color:#065f46;
    }

    .alert.danger{
      background:#fee2e2;
      color:#991b1b;
    }

    label{
      display:block;
      text-align:left;
      font-size:14px;
      margin-bottom:6px;
      color:#6d28d9;
      font-weight:500;
    }

    input{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid #ddd6fe;
      outline:none;
      margin-bottom:16px;
      background:#f5f3ff;
      font-size:14px;
    }

    input:focus{
      border-color:#8b5cf6;
      box-shadow:0 0 5px rgba(139,92,246,0.4);
    }

    /* BUTTON */
    .btn{
      width:100%;
      background:#8b5cf6;
      color:white;
      padding:14px;
      border-radius:30px;
      font-weight:600;
      border:none;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#7c3aed;
      transform:translateY(-2px);
    }

    .back{
      margin-top:16px;
      font-size:14px;
    }

    .back a{
      color:#8b5cf6;
      font-weight:600;
      text-decoration:none;
    }

    .back a:hover{
      text-decoration:underline;
    }

  </style>

</head>

<body>

<div class="page">
  <div class="forgot-card">

```
<h2>Forgot Password 🔐</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert {{ category }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST">

  <label>Email</label>
  <input type="email" name="email" required>

  <label>New Password</label>
  <input type="password" name="password" required>

  <label>Confirm Password</label>
  <input type="password" name="confirmpassword" required>

  <button type="submit" class="btn">Reset Password</button>

</form>

<div class="back">
  <a href="{{ url_for('login') }}">← Back to Login</a>
</div>

</div>

</body>
</html>
