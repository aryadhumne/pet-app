<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Nunito', sans-serif; }

    /* ── BACKGROUND ── */
    .page {
      min-height: 100vh;
      background: url("{{ url_for('static', filename='images/welcome2.jpeg') }}")
                  no-repeat center center / cover;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 24px 20px;
    }
    .page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(14, 165, 233, 0.55) 0%,
        rgba(99, 102, 241, 0.52) 50%,
        rgba(168, 85, 247, 0.48) 100%
      );
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    /* floating paws */
    .paw {
      position: absolute;
      opacity: 0.16;
      animation: floatPaw 4s ease-in-out infinite;
      z-index: 1;
    }
    .paw:nth-child(1) { top: 6%;  left: 7%;  font-size: 20px; animation-delay: 0s; }
    .paw:nth-child(2) { top: 12%; right: 9%; font-size: 30px; animation-delay: 0.9s; }
    .paw:nth-child(3) { bottom: 18%; left: 10%; font-size: 18px; animation-delay: 1.6s; }
    .paw:nth-child(4) { bottom: 10%; right: 8%; font-size: 24px; animation-delay: 2.2s; }
    @keyframes floatPaw {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%       { transform: translateY(-10px) rotate(14deg); }
    }

    /* ── CARD ── */
    .forgot-card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      padding: 36px 28px 30px;
      border-radius: 28px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.3) inset;
      animation: riseUp 0.6s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes riseUp {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── LOCK ICON ── */
    .lock-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0EA5E9, #6366F1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 18px;
      box-shadow: 0 8px 24px rgba(99,102,241,0.3);
      animation: floatImg 3s ease-in-out infinite;
    }
    @keyframes floatImg {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    /* ── HEADING ── */
    h2 {
      font-family: 'Sora', sans-serif;
      font-size: 21px;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 6px;
    }
    .sub-text {
      font-size: 12px;
      color: #9CA3AF;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* ── FLASH MESSAGES ── */
    .alert {
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }
    .alert.success { background: #DCFCE7; color: #166534; }
    .alert.danger  { background: #FEE2E2; color: #991B1B; }

    /* ── FORM ── */
    label {
      display: block;
      text-align: left;
      font-size: 12px;
      font-weight: 800;
      color: #6366F1;
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1.5px solid #C7D2FE;
      background: #F5F3FF;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #1e1b4b;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s, background 0.2s;
    }
    input:focus {
      border-color: #6366F1;
      background: white;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
    }
    input::placeholder { color: #9CA3AF; font-weight: 500; }

    /* ── BUTTON ── */
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #0EA5E9, #6366F1);
      color: white;
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(99,102,241,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(99,102,241,0.45);
    }
    .btn:active { transform: translateY(0); }

    /* ── BACK LINK ── */
    .back {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 700;
      color: #6B7280;
    }
    .back a {
      color: #6366F1;
      font-weight: 800;
      text-decoration: none;
    }
    .back a:hover { text-decoration: underline; color: #4F46E5; }
  </style>
</head>

<body>
<div class="page">

  <span class="paw">🐾</span>
  <span class="paw">🐾</span>
  <span class="paw">🐾</span>
  <span class="paw">🐾</span>

  <div class="forgot-card">

    <div class="lock-icon">🔐</div>

    <h2>Forgot Password</h2>
    <p class="sub-text">Enter your email and set a new password</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">

      <label>Email</label>
      <input type="email" name="email" placeholder="Your email address" required>

      <label>New Password</label>
      <input type="password" name="password" placeholder="Create new password" required>

      <label>Confirm Password</label>
      <input type="password" name="confirmpassword" placeholder="Repeat new password" required>

      <button type="submit" class="btn">Reset Password 🔐</button>

    </form>

    <div class="back">
      <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>

  </div>
</div>
</body>
</html>
