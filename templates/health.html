{% extends "base.html" %}
{% block content %}

<div class="health-wrapper">

    <!-- PAGE TITLE -->
    <h2 class="health-title animate-fade">
        🩺 Pet Health Care
    </h2>

    <p class="health-subtitle animate-fade-delay">
        Complete health support for your beloved pet 🐾
    </p>

    <!-- HEALTH IMAGE -->
    <div class="health-image animate-float">
        <img src="{{ url_for('static', filename='images/h2.jpg') }}" alt="Pet Health">
    </div>

    <!-- HEALTH OPTIONS CARD -->
    <div class="health-card animate-slideup">

        <h4 class="card-title">Manage Your Pet's Health</h4>
        <p class="card-subtitle">
            Vaccinations • Diet Plans • Regular Checkups
        </p>

        <div class="health-buttons">

            <a href="{{ url_for('add_vaccine') }}" class="health-btn lavender">
                💉 Vaccination
            </a>

            <a href="{{ url_for('health_checkup') }}" class="health-btn lavender-light">
                🩺 Health Checkup
            </a>

            <a href="{{ url_for('diet_plan') }}" class="health-btn lavender-dark">
                🥗 Diet Plan
            </a>

        </div>
    </div>

</div>

<style>
/* ================= LAVENDER THEME COLORS ================= */
:root {
    --lavender: #7c4dff;
    --lavender-light: #c6b3ff;
    --lavender-dark: #5e35b1;
    --lavender-bg: #f3f4ff;
}

/* ================= MAIN WRAPPER ================= */
.health-wrapper {
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--lavender-bg), #ffffff);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
}

/* ================= TITLES ================= */
.health-title {
    font-weight: 800;
    color: var(--lavender-dark);
    margin-top: 10px;
    text-shadow: 0 0 12px rgba(124,77,255,0.25);
}

.health-subtitle {
    font-size: 13px;
    color: #6c63ff;
    text-align: center;
    margin-bottom: 10px;
}

/* ================= IMAGE ================= */
.health-image img {
    width: 170px;
    margin-bottom: 15px;
    border-radius: 20px;
    box-shadow: 0 12px 25px rgba(124,77,255,0.25);
}

/* ================= CARD ================= */
.health-card {
    width: 95%;
    max-width: 400px;
    background: rgba(245,245,255,0.95);
    border-radius: 26px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(124,77,255,0.25);
}

/* ================= CARD TEXT ================= */
.card-title {
    font-weight: 700;
    color: var(--lavender-dark);
}

.card-subtitle {
    font-size: 13px;
    color: #7c63ff;
    margin-bottom: 20px;
}

/* ================= BUTTONS ================= */
.health-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* ================= COMMON BUTTON ================= */
.health-btn {
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    font-weight: 600;
    color: white;
    text-decoration: none;
    transition: 0.3s ease;
}

/* ================= BUTTON COLORS ================= */
.health-btn.lavender {
    background: linear-gradient(135deg, var(--lavender), var(--lavender-dark));
}

.health-btn.lavender-light {
    background: linear-gradient(135deg, var(--lavender-light), var(--lavender));
}

.health-btn.lavender-dark {
    background: linear-gradient(135deg, var(--lavender-dark), #4b3cb6);
}

/* ================= BUTTON HOVER ================= */
.health-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 0 20px rgba(124,77,255,0.35);
}

/* ================= ANIMATIONS ================= */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}
.animate-float { animation: float 3s ease-in-out infinite; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade { animation: fadeIn 0.8s forwards; }
.animate-fade-delay { animation: fadeIn 1.5s forwards; }

@keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-slideup { animation: slideUp 1s ease forwards; }
</style>

{% endblock %}
