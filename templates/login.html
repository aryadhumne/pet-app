<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Get Started</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Poppins, sans-serif;
    }

    /* ===== FULL BACKGROUND ===== */
    .page {
      min-height: 100vh;
      width: 100%;
      background-image: url("{{ url_for('static', filename='images/welcome2.jpeg') }}");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ===== BLUR + LAVENDER OVERLAY ===== */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(230, 230, 255, 0.75); /* lavender overlay */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* ===== CARD ===== */
    .content {
      position: relative;
      background: rgba(245, 245, 255, 0.95); /* light lavender card */
      padding: 36px 26px;
      border-radius: 22px;
      text-align: center;
      width: 70%;
      max-width: 350px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    /* ===== IMAGE INSIDE CARD ===== */
    .pet-img {
      width: 160px;
      margin-bottom: 22px;
      border-radius: 14px;
    }

    h2 {
      color: #4b3cb6; /* deep lavender */
      margin-bottom: 10px;
    }

    p {
      color: #6c63ff; /* soft lavender text */
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* ===== BUTTONS ===== */
    .btn {
      width: 90%;
      background: #7c4dff; /* lavender button */
      color: white;
      padding: 14px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 14px;
      display: block;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .btn:hover {
      background: #5e35b1; /* darker hover lavender */
      transform: translateY(-2px);
    }

    .btn-outline {
      background: white;
      color: #7c4dff; /* lavender border/text */
      border: 2px solid #7c4dff;
    }

    .btn-outline:hover {
      background: #eae6ff; /* light lavender hover */
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

<div class="page">

  <div class="content">

    <!-- Card image -->
    <img src="{{ url_for('static', filename='images/cat.jpeg') }}"
         class="pet-img" alt="Welcome">

    <h2>Let’s get you started</h2>
    <p>Create an account or log in if you already have one</p>

    <a href="{{ url_for('register') }}" class="btn">
      Register 🐾
    </a>

    <a href="{{ url_for('login') }}" class="btn btn-outline">
      Log in
    </a>

  </div>

</div>

</body>
</html>
